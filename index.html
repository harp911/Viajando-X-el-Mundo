<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajando X el Mundo — Sorteos de Lujo</title>
    <!-- Tailwind CC Play -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0D1B2A',
                        gold: '#F5A800',
                        cyan: '#00AEEF',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <!-- React & Babel for CDN usage -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Register custom React preset to use classic runtime (React.createElement)
        // This avoids Babel Standalone injecting modern ES module imports which break in the browser.
        Babel.registerPreset("custom-react", {
            presets: [
                [Babel.availablePresets["react"], { runtime: "classic" }]
            ]
        });
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script type="text/babel" data-presets="custom-react" src="app.js"></script>

    <div class="bg-texture"></div>
    <div id="airplanes-container"></div>

    <script>
        // Airplane background animation logic
        function createAirplane() {
            const container = document.getElementById('airplanes-container');
            const plane = document.createElement('div');
            plane.className = 'airplane';
            plane.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00AEEF" stroke-width="2"><path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"></path></svg>';
            
            const startY = Math.random() * 100;
            const duration = 15 + Math.random() * 20;
            
            plane.style.top = `${startY}vh`;
            plane.style.left = '-50px';
            plane.style.animation = `fly-diagonal ${duration}s linear infinite`;
            
            container.appendChild(plane);
            setTimeout(() => plane.remove(), duration * 1000);
        }

        setInterval(createAirplane, 8000);
        createAirplane();
    </script>
</body>
</html>
